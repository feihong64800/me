    <style>

        * {

            box-sizing: border-box;

        }



        body {

            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            min-height: 100vh;

            padding-bottom: 30px;

        }



        .header {

            background: rgba(255, 255, 255, 0.95);

            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);

            backdrop-filter: blur(10px);

            position: sticky;

            top: 0;

            z-index: 100;

        }



        .header-inner {

            max-width: 1200px;

            margin: 0 auto;

            padding: 0 15px;

            height: 50px;

            display: flex;

            align-items: center;

        }



        .logo {

            font-size: 18px;

            font-weight: bold;

            color: #667eea;

        }



        .container {

            max-width: 800px;

            margin: 0 auto;

            padding: 20px 15px;

        }



        .title-section {

            text-align: center;

            padding: 30px 0;

            color: #fff;

        }



        .title-section h1 {

            font-size: 28px;

            margin-bottom: 10px;

            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);

        }



        .title-section p {

            font-size: 14px;

            opacity: 0.9;

        }



        .link-group {

            background: rgba(255, 255, 255, 0.95);

            border-radius: 16px;

            padding: 20px;

            margin-bottom: 20px;

            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);

            backdrop-filter: blur(10px);

        }



        .link-group-title {

            font-size: 16px;

            font-weight: bold;

            color: #333;

            margin-bottom: 15px;

            padding-bottom: 10px;

            border-bottom: 2px solid #667eea;

        }



        .link-item {

            display: flex;

            align-items: center;

            padding: 12px 15px;

            margin-bottom: 10px;

            background: #f8f9fa;

            border-radius: 10px;

            text-decoration: none;

            color: #333;

            transition: all 0.3s;

        }



        .link-item:last-child {

            margin-bottom: 0;

        }



        .link-item:hover {

            background: #667eea;

            color: #fff;

            transform: translateX(5px);

            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);

        }



        .link-icon {

            width: 20px;

            height: 20px;

            margin-right: 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 16px;

        }



        .link-text {

            flex: 1;

            font-size: 14px;

            font-weight: 500;

        }



        .link-arrow {

            color: #999;

            font-size: 18px;

            transition: transform 0.3s;

        }



        .link-item:hover .link-arrow {

            transform: translateX(3px);

            color: #fff;

        }



        .footer {

            text-align: center;

            color: rgba(255, 255, 255, 0.7);

            font-size: 12px;

            padding: 20px 0;

        }



        @media (max-width: 600px) {

            .title-section h1 {

                font-size: 22px;

            }



            .link-group {

                padding: 15px;

            }



            .link-item {

                padding: 10px 12px;

            }

        }

    </style>

</head>
